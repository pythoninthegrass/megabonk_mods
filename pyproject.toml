[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "megabonk-mods"
version = "0.1.0"
authors = [
    { name = "pythoninthegrass", email = "4097471+pythoninthegrass@users.noreply.github.com" }
]
requires-python = ">=3.13,<3.14"

dependencies = [
    "anyio>=4.9",
    "evdev>=1.9; sys_platform == 'linux'",
    "jq>=1.8",
    "mcp>=2.3,<3",
    "mcp-types>=2.3,<3",
    "pillow>=11",
    "pydantic>=2.12",
    "python-decouple>=3.8",
    "toon-format==1.2.0",
]

[project.scripts]
megabonk-mcp = "megabonk_harness.mcp_server:main"
megabonk-harness = "megabonk_harness.run:run_main"

[tool.uv.build-backend]
module-name = "megabonk_harness"

[dependency-groups]
dev = [
    "argcomplete>=3.7.2,<4",
    "coverage>=7.17.0,<8",
    "hypothesis[cli]>=6.170.14,<7",
    "ipython>=9.18.0,<10",
    "pyclean>=3.7.0,<4",
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.4.1,<2",
    "pytest-cov>=7.1.0,<8",
    "pytest-datafiles>=3.0.1,<4",
    "pytest-xdist>=3.8.0,<4",
    "pyyaml>=6,<7",
    "rich>=15.0.0,<16",
    "ruff>=0.17.3,<0.18",
]

[tool.uv]
exclude-newer = "2026-10-31T00:00:00Z"
prerelease = "allow"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "src"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
asyncio_mode = "auto"
addopts = "-n auto"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "benchmark: marks performance benchmark tests"
]

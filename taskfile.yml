# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

set: ["e", "u", "pipefail"]
shopt: ["globstar"]

vars:
  MISE_SHIMS: "{{.HOME}}/.local/share/mise/shims"

env:
  PATH: "{{.MISE_SHIMS}}:{{.PATH}}"

includes:
  mod: taskfiles/mod.yml
  game: taskfiles/game.yml
  re: taskfiles/re.yml

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  build:
    desc: "Build the mod"
    cmds:
      - task: mod:build

  test:
    desc: "Run the mod's unit tests and the Python tooling self-tests"
    cmds:
      - task: mod:test
      - task: tools:test

  tools:test:
    desc: "Run every tools/test_*.py self-test via uv"
    cmds:
      - for f in tools/test_*.py; do uv run "$f"; done

  lint:
    desc: "markdownlint + ruff over the repo"
    cmds:
      - markdownlint -c .markdownlint.jsonc .
      - ruff check tools/

  check:
    desc: "Build, test, and lint in sequence; non-zero exit on any failure"
    cmds:
      - task: build
      - task: test
      - task: lint

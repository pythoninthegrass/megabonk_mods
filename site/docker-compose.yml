# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  pocketbase:
    build:
      context: ../pocketbase
    image: megabonk-levels-api:local
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      PB_OAUTH_GITHUB_CLIENT_ID: ${PB_OAUTH_GITHUB_CLIENT_ID:-}
      PB_OAUTH_GITHUB_CLIENT_SECRET: ${PB_OAUTH_GITHUB_CLIENT_SECRET:-}
      PB_OAUTH_GOOGLE_CLIENT_ID: ${PB_OAUTH_GOOGLE_CLIENT_ID:-}
      PB_OAUTH_GOOGLE_CLIENT_SECRET: ${PB_OAUTH_GOOGLE_CLIENT_SECRET:-}
      PB_OAUTH_DISCORD_CLIENT_ID: ${PB_OAUTH_DISCORD_CLIENT_ID:-}
      PB_OAUTH_DISCORD_CLIENT_SECRET: ${PB_OAUTH_DISCORD_CLIENT_SECRET:-}
    volumes:
      - pocketbase-data:/pb_data
    init: true

  site:
    build:
      context: ..
      dockerfile: site/Dockerfile
      args:
        PUBLIC_PB_URL: ${PUBLIC_PB_URL:-http://127.0.0.1:8090}
    image: megabonkmod-party-site:local
    ports:
      - "127.0.0.1:${SITE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "bun", "smoke.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    init: true

volumes:
  pocketbase-data:

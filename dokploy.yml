# yaml-language-server: $schema=https://raw.githubusercontent.com/pythoninthegrass/icarus/main/schemas/dokploy.schema.json

# Deploys the showcase and wiki (site/) and the gallery API (pocketbase/) to Dokploy.
# Run the ic CLI from site/, e.g. `ic --env prod apply`.

project:
  name: megabonkmod-party
  description: |
    Megabonk Levels website. The site app is the static Astro showcase and
    player wiki, served by the dependency-free static server run by Bun
    (site/Dockerfile). The pocketbase app is the community level gallery API
    (pocketbase/Dockerfile), deployed first with its data on a persistent volume.

  # Only pocketbase receives the env file; ic pushes it filtered by ENV_EXCLUDES.
  env_targets: [pocketbase]

  deploy_order:
    - [pocketbase]
    - [site]

github:
  owner: pythoninthegrass
  repository: megabonk_mods
  branch: main

environments:
  prod:
    apps:
      pocketbase:
        domain:
          - host: api.megabonkmod.party
            port: 8090
            path: /
            internalPath: /
            stripPath: false
            https: true
            certificateType: letsencrypt
        autoDeploy: true
      site:
        domain:
          - host: megabonkmod.party
            port: 8080
            path: /
            internalPath: /
            stripPath: false
            https: true
            certificateType: letsencrypt
          - host: www.megabonkmod.party
            port: 8080
            path: /
            internalPath: /
            stripPath: false
            https: true
            certificateType: letsencrypt
          - host: docs.megabonkmod.party
            port: 8080
            path: /
            internalPath: /
            stripPath: false
            https: true
            certificateType: letsencrypt
        # Traefik redirectRegex: the apex is canonical, so www redirects to it.
        # permanent: true surfaces as HTTP 308, which preserves the method and path.
        redirects:
          - regex: ^https?://www\.megabonkmod\.party(.*)$
            replacement: https://megabonkmod.party$1
            permanent: true
        autoDeploy: true

apps:
  - name: pocketbase
    source: github
    buildType: dockerfile
    dockerfile: pocketbase/Dockerfile
    dockerContextPath: /pocketbase
    buildPath: /
    triggerType: push
    autoDeploy: false
    watchPaths:
      - pocketbase/**
    volumes:
      - source: pocketbase-data
        target: /pb_data
        type: volume
    create_env_file: false
    healthCheck:
      command: wget -q --spider http://127.0.0.1:8090/api/health
      interval: 30s
      timeout: 5s
      startPeriod: 10s
      retries: 3
    restartPolicy:
      condition: any

  - name: site
    source: github
    buildType: dockerfile
    dockerfile: site/Dockerfile
    dockerContextPath: /
    buildPath: /
    triggerType: push
    autoDeploy: false
    watchPaths:
      - site/**
      - docs/**
    create_env_file: false
    healthCheck:
      command: bun smoke.mjs
      interval: 30s
      timeout: 10s
      startPeriod: 15s
      retries: 3
    restartPolicy:
      condition: any

# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

vars:
  OUTPUT: '{{.OUTPUT | default ".tools/installer-dist"}}'
  MOD_VERSION: '{{.MOD_VERSION | default "dev"}}'

tasks:
  thunderstore:setup:
    desc: "Install the pinned local Thunderstore build/publish CLI"
    status:
      - test -x .tools/tcli/tcli
    cmds:
      - dotnet tool install tcli --version 0.2.4 --tool-path .tools/tcli

  thunderstore:
    desc: "Build and validate the Thunderstore ZIP (no publish)"
    cmds:
      - task: thunderstore:setup
      - task: thunderstore:manifest
      - dotnet build src/MegabonkLevels.Mod/MegabonkLevels.Mod.csproj -c Release
      - uv run pytest tests/test_thunderstore_package.py -n 0 -q
      - .tools/tcli/tcli build
      - task: thunderstore:check

  thunderstore:manifest:
    desc: "Validate a manifest.json against Thunderstore's manifest rules (ONLINE=true adds the site's own checks)"
    summary: |
      Usage: task package:thunderstore:manifest [MANIFEST=path] [ONLINE=true]

      Reimplements thunderstore.io/tools/manifest-v1-validator/ offline, so the team does not
      have to be logged into the site to find a rejected manifest. ONLINE=true additionally
      resolves each dependency against thunderstore.io, reports a version already published,
      and reports a name that exists under a different capitalization.

        task package:thunderstore:manifest
        task package:thunderstore:manifest MANIFEST=.tools/thunderstore/<team>-Megabonk_Level_Editor-<version>.zip
        task package:thunderstore:manifest ONLINE=true
    vars:
      MANIFEST: '{{.MANIFEST | default "pkg/manifest.json"}}'
      ONLINE: '{{.ONLINE | default "false"}}'
    cmds:
      - uv run scripts/validate_thunderstore_manifest.py "{{.MANIFEST}}"{{if eq .ONLINE "true"}} --online{{end}}

  thunderstore:check:
    desc: "Validate the existing Thunderstore ZIP against its source and Release DLLs"
    cmds:
      - |-
        uv run python - <<'PY'
        import subprocess
        import tomllib
        from pathlib import Path

        config = tomllib.loads(Path("thunderstore.toml").read_text())
        package = config["package"]
        name = f'{package["namespace"]}-{package["name"]}-{package["versionNumber"]}.zip'
        path = Path(config["build"]["outdir"]) / name
        subprocess.run(["uv", "run", "scripts/check_thunderstore_package.py", str(path)], check=True)
        subprocess.run(["uv", "run", "scripts/validate_thunderstore_manifest.py", str(path)], check=True)
        PY

  linux:
    desc: "Build the Linux distributable: the installer binary and a README, and nothing else"
    summary: |
      Usage: task package:linux [MOD_VERSION=...] [OUTPUT=...]

      Builds the linux/amd64 Go installer (installer:build) and writes
      megabonk-installer-<version>-linux.zip holding exactly that binary and a
      README that says how to run it. The mod DLL, the levels, the packs and the
      loader are fetched by the installer at run time from the site and
      Thunderstore, so nothing here bundles them and building needs no
      Thunderstore access.

        task package:linux
        task package:linux MOD_VERSION=0.4.2

      Set SOURCE_DATE_EPOCH for a byte-identical zip.
    cmds:
      - task installer:build TARGETS=linux/amd64
      - uv run scripts/installer_package.py build
        --installer-binary .tools/installer/megabonk-installer-linux-amd64
        --out-dir "{{.OUTPUT}}" --platform linux --version "{{.MOD_VERSION}}"
      - task: check
        vars: {CHECK_ZIP: "{{.OUTPUT}}/megabonk-installer-{{.MOD_VERSION}}-linux.zip", CHECK_PLATFORM: linux}

  windows:
    desc: "Build the Windows distributable: the installer binary and a README, and nothing else"
    summary: |
      Usage: task package:windows [MOD_VERSION=...] [OUTPUT=...]

      Builds the windows/amd64 Go installer (installer:build) and writes
      megabonk-installer-<version>-windows.zip holding exactly
      megabonk-installer.exe and a README. A Windows player unzips it and runs
      the exe, which fetches the mod, levels and packs at run time. Arguments
      match package:linux.

        task package:windows
        task package:windows MOD_VERSION=0.4.2
    cmds:
      - task installer:build TARGETS=windows/amd64
      - uv run scripts/installer_package.py build
        --installer-binary .tools/installer/megabonk-installer-windows-amd64.exe
        --out-dir "{{.OUTPUT}}" --platform windows --version "{{.MOD_VERSION}}"
      - task: check
        vars: {CHECK_ZIP: "{{.OUTPUT}}/megabonk-installer-{{.MOD_VERSION}}-windows.zip", CHECK_PLATFORM: windows}

  macos:
    desc: "Build the macOS distributable: the installer binary and a README, and nothing else"
    summary: |
      Usage: task package:macos [MOD_VERSION=...] [OUTPUT=...]
             [APPLE_SIGNING_IDENTITY=...] [NOTARY_PROFILE=... | APPLE_API_KEY=... APPLE_API_ISSUER=... APPLE_API_KEY_B64=...]

      Builds the darwin/arm64 Go installer (installer:build) and writes
      megabonk-installer-<version>-macos.zip holding exactly the bare
      megabonk-installer binary, mode 0755, and a README. Only Apple silicon is
      built: no Intel Mac was available to test an amd64 binary. Arguments match
      package:linux.

      Set APPLE_SIGNING_IDENTITY to a Developer ID Application identity name (see
      `security find-identity -v -p codesigning`) to codesign the installer with the
      hardened runtime before it is packed. Set NOTARY_PROFILE to a notarytool keychain
      profile (`xcrun notarytool store-credentials`), or APPLE_API_KEY, APPLE_API_ISSUER
      and APPLE_API_KEY_B64 (an App Store Connect API key, base64 of the .p8), to also
      submit the zip to Apple and wait for the verdict. All are read from the
      environment, never from the repo.

        task package:macos
        APPLE_SIGNING_IDENTITY="Developer ID Application: ..." NOTARY_PROFILE=<profile> task package:macos
    cmds:
      - task installer:build TARGETS=darwin/arm64
      - |-
        set -eu
        if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" \
            .tools/installer/megabonk-installer-darwin-arm64
          codesign --verify --strict --verbose=2 .tools/installer/megabonk-installer-darwin-arm64
        else
          echo "APPLE_SIGNING_IDENTITY is not set: the installer is only ad-hoc signed" >&2
        fi
      - uv run scripts/installer_package.py build
        --installer-binary .tools/installer/megabonk-installer-darwin-arm64
        --out-dir "{{.OUTPUT}}" --platform macos --version "{{.MOD_VERSION}}"
      - task: check
        vars: {CHECK_ZIP: "{{.OUTPUT}}/megabonk-installer-{{.MOD_VERSION}}-macos.zip", CHECK_PLATFORM: macos}
      - |-
        set -eu
        if [ -n "${NOTARY_PROFILE:-}" ] || [ -n "${APPLE_API_KEY:-}" ]; then
          uv run scripts/notarize_macos.py "{{.OUTPUT}}/megabonk-installer-{{.MOD_VERSION}}-macos.zip"
        fi

  check:
    desc: "Verify a distributable zip holds exactly the installer binary and the README"
    summary: |
      Usage: task package:check [CHECK_ZIP=path] [CHECK_PLATFORM=linux|windows|macos]

      Fails on any entry other than the platform's installer binary and
      README.txt, and on either one missing. package:linux, package:windows and
      package:macos run it on what they just built.

        task package:check
        task package:check CHECK_ZIP=.tools/installer-dist/megabonk-installer-0.4.2-linux.zip
    vars:
      CHECK_ZIP: '{{.CHECK_ZIP | default ".tools/installer-dist/megabonk-installer-dev-linux.zip"}}'
      CHECK_PLATFORM: '{{.CHECK_PLATFORM | default "linux"}}'
    cmds:
      - uv run scripts/installer_package.py "{{.CHECK_ZIP}}" --platform "{{.CHECK_PLATFORM}}"

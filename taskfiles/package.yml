# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

vars:
  OUTPUT: '{{.OUTPUT | default ".tools/player-package"}}'
  OUTPUT_WINDOWS: '{{.OUTPUT_WINDOWS | default ".tools/player-package-windows"}}'
  OUTPUT_MACOS: '{{.OUTPUT_MACOS | default ".tools/player-package-macos"}}'
  MOD_VERSION: '{{.MOD_VERSION | default "dev"}}'
  LEVELS: '{{.LEVELS | default "example-forest.mblevel.json"}}'
  PACKS: '{{.PACKS | default ""}}'
  ALLOW_DOWNLOAD: '{{.ALLOW_DOWNLOAD | default "false"}}'

tasks:
  linux:
    desc: "Build the Linux player package and its distributable zip into .tools/player-package"
    summary: |
      Usage: task package:linux [LEVELS=...] [PACKS=...] [MOD_VERSION=...] [OUTPUT=...]

      Assembles the download a player unzips and runs ./install.sh on: the mod DLL,
      the vendored Windows MelonLoader and .NET 6 archives, the installer, and any
      levels or packs you name. Nothing is bundled unless you ask for it, so a dev
      map never reaches a player by accident.

        task package:linux
        task package:linux LEVELS="example-forest.mblevel.json thps.mblevel.json" PACKS=thps
        task package:linux MOD_VERSION=0.4.2

      LEVELS are filenames under levels/ and PACKS are pack ids built by task pack:*.
      Vendor archives are reused from .tools/vendor-cache; add ALLOW_DOWNLOAD=true to
      fetch anything missing. Set SOURCE_DATE_EPOCH for a byte-identical zip.
    cmds:
      - dotnet build src/MegabonkLevels.Mod/MegabonkLevels.Mod.csproj -c Release
      - |-
        set -eu
        args=()
        for level in {{.LEVELS}}; do args+=(--level "$level"); done
        for pack in {{.PACKS}}; do args+=(--pack "$pack"); done
        if [ "{{.ALLOW_DOWNLOAD}}" = "true" ]; then args+=(--allow-download); fi
        uv run scripts/build_player_package.py \
          --output "{{.OUTPUT}}" \
          --mod-dir src/MegabonkLevels.Mod/bin/Release/net6.0 \
          --mod-version "{{.MOD_VERSION}}" \
          "${args[@]}"

  windows:
    desc: "Build the Windows player package and its distributable zip into .tools/player-package-windows"
    summary: |
      Usage: task package:windows [LEVELS=...] [PACKS=...] [MOD_VERSION=...] [OUTPUT_WINDOWS=...]

      Assembles the download a Windows player unzips and runs install.exe from: the
      mod DLL, the vendored MelonLoader and .NET 6 archives, the windows/amd64 Go
      installer (built by installer:build), and any levels or packs you name.
      Arguments and vendor caching match package:linux.

        task package:windows
        task package:windows LEVELS="example-forest.mblevel.json" MOD_VERSION=0.4.2
    cmds:
      - dotnet build src/MegabonkLevels.Mod/MegabonkLevels.Mod.csproj -c Release
      - task installer:build TARGETS=windows/amd64
      - |-
        set -eu
        args=()
        for level in {{.LEVELS}}; do args+=(--level "$level"); done
        for pack in {{.PACKS}}; do args+=(--pack "$pack"); done
        if [ "{{.ALLOW_DOWNLOAD}}" = "true" ]; then args+=(--allow-download); fi
        uv run scripts/build_player_package.py \
          --platform windows \
          --installer-binary .tools/installer/megabonk-installer-windows-amd64.exe \
          --output "{{.OUTPUT_WINDOWS}}" \
          --mod-dir src/MegabonkLevels.Mod/bin/Release/net6.0 \
          --mod-version "{{.MOD_VERSION}}" \
          "${args[@]}"

  macos:
    desc: "Build the macOS player package and its distributable zip into .tools/player-package-macos"
    summary: |
      Usage: task package:macos [LEVELS=...] [PACKS=...] [MOD_VERSION=...] [OUTPUT_MACOS=...]
             [MACOS_SIGN_IDENTITY=...] [NOTARY_PROFILE=...]

      Assembles the download a Mac player unzips and runs megabonk-installer from: the
      mod DLL, the vendored MelonLoader and .NET 6 archives (the game is the Windows
      build under Wine), the darwin/arm64 Go installer (built by installer:build), and
      any levels or packs you name. Arguments and vendor caching match package:linux.

      Set MACOS_SIGN_IDENTITY to a Developer ID Application identity name (see
      `security find-identity -v -p codesigning`) to codesign the installer with the
      hardened runtime before it is packed. Set NOTARY_PROFILE to a notarytool keychain
      profile (`xcrun notarytool store-credentials`) to also submit the zip to Apple
      and wait for the verdict. Both are read from the environment, never from the repo.

        task package:macos
        MACOS_SIGN_IDENTITY="Developer ID Application: ..." NOTARY_PROFILE=megabonk task package:macos
    cmds:
      - dotnet build src/MegabonkLevels.Mod/MegabonkLevels.Mod.csproj -c Release
      - task installer:build TARGETS=darwin/arm64
      - |-
        set -eu
        if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
          codesign --force --timestamp --options runtime --sign "$MACOS_SIGN_IDENTITY" \
            .tools/installer/megabonk-installer-darwin-arm64
          codesign --verify --strict --verbose=2 .tools/installer/megabonk-installer-darwin-arm64
        else
          echo "MACOS_SIGN_IDENTITY is not set: the installer is only ad-hoc signed" >&2
        fi
      - |-
        set -eu
        args=()
        for level in {{.LEVELS}}; do args+=(--level "$level"); done
        for pack in {{.PACKS}}; do args+=(--pack "$pack"); done
        if [ "{{.ALLOW_DOWNLOAD}}" = "true" ]; then args+=(--allow-download); fi
        uv run scripts/build_player_package.py \
          --platform macos \
          --installer-binary .tools/installer/megabonk-installer-darwin-arm64 \
          --output "{{.OUTPUT_MACOS}}" \
          --mod-dir src/MegabonkLevels.Mod/bin/Release/net6.0 \
          --mod-version "{{.MOD_VERSION}}" \
          "${args[@]}"
      - |-
        set -eu
        if [ -n "${NOTARY_PROFILE:-}" ]; then
          zip="$(ls -t "$(dirname "{{.OUTPUT_MACOS}}")"/megabonk-levels-*-macos.zip | head -1)"
          xcrun notarytool submit "$zip" --keychain-profile "$NOTARY_PROFILE" --wait
        fi

  check:
    desc: "Verify a built player package still matches its manifest"
    vars:
      OUTPUT: '{{.OUTPUT | default ".tools/player-package"}}'
    cmds:
      - |-
        PYTHONPATH=scripts uv run python - <<'PY'
        import sys
        from pathlib import Path
        from player_installer.manifest import verify_package

        problems = verify_package(Path("{{.OUTPUT}}"))
        for problem in problems:
            print(f"  {problem}", file=sys.stderr)
        raise SystemExit(1 if problems else 0)
        PY

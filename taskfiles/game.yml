# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

tasks:
  melonloader:install:
    desc: "Install the pinned MelonLoader release into the resolved game directory (idempotent)"
    summary: |
      Usage: task game:melonloader:install

      No task-level status: check - scripts/install_melonloader.py does its
      own idempotency check on the download/extract step internally, but
      still needs to run every time to retry the CrossOver Wine DLL
      override, which isn't tracked by the version marker.
    cmds:
      - uv run scripts/install_melonloader.py

  run:
    desc: "Launch Megabonk"
    summary: |
      Usage: task game:run

      Platform-guarded. macOS: starts Megabonk.exe directly in the CrossOver
      Steam bottle with cxstart, in the background, with SteamAppId and
      SteamGameId set so Steamworks initializes; the Steam client must
      already be running (the steam:// URI only opened the CrossOver window).
      Linux: uses the native `steam` binary when present, otherwise the
      Flatpak Steam, defaulting DISPLAY and XAUTHORITY so it also works from a
      non-graphical shell (KDE Wayland). Windows: runs `steam` directly.
    cmds:
      - uv run scripts/install_melonloader.py

  run:
    desc: "Launch Megabonk"
    summary: |
      Usage: task game:run

      Platform-guarded: on macOS starts Megabonk.exe directly in the CrossOver
      Steam bottle with cxstart with SteamAppId and SteamGameId set so Steamworks initializes (the
      Steam client must already be running; the steam:// URI only opened the
      CrossOver window); returns once the game process is started in the background; on Linux uses the native `steam`
      binary when present, otherwise the Flatpak Steam, defaulting DISPLAY
      and XAUTHORITY so it also works from a non-graphical shell (KDE
      Wayland); runs `steam` directly on Windows.
    cmds:
      - cmd: |
          game='C:\Program Files (x86)\Steam\steamapps\common\Megabonk'
          python3 - "$game" <<'PY'
          import ntpath, os, subprocess, sys
          cxstart = "/Applications/CrossOver.app/Contents/SharedSupport/CrossOver/bin/cxstart"
          game = sys.argv[1]
          env = {**os.environ, "SteamAppId": "3405340", "SteamGameId": "3405340"}
          args = [cxstart, "--bottle", "Steam", "--workdir", game, ntpath.join(game, "Megabonk.exe")]
          subprocess.Popen(args, env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, start_new_session=True)
          PY
        platforms: [darwin]
      - cmd: |
          export DISPLAY="${DISPLAY:-:0}"
          if [ -z "${XAUTHORITY:-}" ]; then
            auth="$(ls /run/user/$(id -u)/xauth_* 2>/dev/null | head -n 1 || true)"
            if [ -n "$auth" ]; then export XAUTHORITY="$auth"; fi
          fi
          if command -v steam >/dev/null 2>&1; then
            steam steam://rungameid/3405340
          else
            flatpak run com.valvesoftware.Steam steam://rungameid/3405340
          fi
        platforms: [linux]
      - cmd: steam steam://rungameid/3405340
        platforms: [windows]

  log:
    desc: "Tail MelonLoader's Latest.log from the resolved game directory"
    cmds:
      - tail -f "$(uv run scripts/game_paths.py | python3 -c 'import json, sys; print(json.load(sys.stdin)["latest_log_path"])')"

  harness:
    desc: "Drive the dev harness in the running game (enable, disable, load, screenshot, quit, cycle)"
    summary: |
      Usage: task game:harness -- cycle levels/example-forest.mblevel.json out.png

      Wraps scripts/run.py; see docs/development.md.
    cmds:
      - uv run scripts/run.py {{.CLI_ARGS}}

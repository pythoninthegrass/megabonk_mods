# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

tasks:
  melonloader:install:
    desc: "Install the pinned MelonLoader release into the resolved game directory (idempotent)"
    summary: |
      Usage: task game:melonloader:install

      No task-level status: check - scripts/install_melonloader.py does its
      own idempotency check on the download/extract step internally, but
      still needs to run every time to retry the Wine DLL override, which
      isn't tracked by the version marker.
    cmds:
      - uv run scripts/install_melonloader.py

  mingw:install:
    desc: "Install the mingw-w64 cross compiler used to build the offline Steamworks stub (macOS)"
    summary: |
      Usage: task game:mingw:install

      Installs the mingw-w64 toolchain (x86_64-w64-mingw32-gcc) via Homebrew,
      which builds the PE32+ steam_api64.dll stub that lets Megabonk launch
      without a logged-in Steam session; see the offline-launch section of
      docs/development.md. Idempotent: skips itself when the compiler is
      already on PATH.
    platforms: [darwin]
    status:
      - test -x "$(command -v x86_64-w64-mingw32-gcc || true)"
    cmds:
      - brew install mingw-w64

  run:
    desc: "Launch Megabonk"
    summary: |
      Usage: task game:run

      Platform-guarded. macOS: starts Megabonk.exe under plain Wine through
      scripts/launch_game.py, detached (via the logged-in GUI session under SSH),
      with SteamAppId and SteamGameId set so
      Steamworks initializes; the Steam client must already be running (task
      game:steam). Use task crossover:run for the CrossOver runtime. Linux:
      uses the native `steam` binary when present, otherwise the Flatpak
      Steam, defaulting DISPLAY and XAUTHORITY so it also works from a
      non-graphical shell (KDE Wayland). Windows: runs `steam` directly.
    cmds:
      - cmd: uv run scripts/launch_game.py game
        platforms: [darwin]
      - cmd: |
          export DISPLAY="${DISPLAY:-:0}"
          if [ -z "${XAUTHORITY:-}" ]; then
            auth="$(ls /run/user/$(id -u)/xauth_* 2>/dev/null | head -n 1 || true)"
            if [ -n "$auth" ]; then export XAUTHORITY="$auth"; fi
          fi
          if command -v steam >/dev/null 2>&1; then
            steam steam://rungameid/3405340
          else
            flatpak run com.valvesoftware.Steam steam://rungameid/3405340
          fi
        platforms: [linux]
      - cmd: steam steam://rungameid/3405340
        platforms: [windows]

  steam:
    desc: "Start the Steam client under Wine (macOS)"
    summary: |
      Usage: task game:steam

      Starts the Steam client with -silent through scripts/launch_game.py,
      detached. Steam takes about 30 seconds to log on; wait for it before
      task game:run or run.py relaunch.
    platforms: [darwin]
    cmds:
      - uv run scripts/launch_game.py steam

  log:
    desc: "Tail MelonLoader's Latest.log from the resolved game directory"
    cmds:
      - tail -f "$(uv run scripts/game_paths.py | python3 -c 'import json, sys; print(json.load(sys.stdin)["latest_log_path"])')"

  editor:
    desc: "(Re)launch Megabonk into editor mode on a custom level as Tony McZoom"
    summary: |
      Usage: task game:editor
             task game:editor -- levels/other.mblevel.json

      Wraps scripts/run.py relaunch: quits any running game, launches a fresh
      one (task game:run, or task crossover:run under the CrossOver runtime),
      loads the level (default levels/example-forest.mblevel.json) and enters
      editor mode with 2 Feathers (MEGABONK_RELAUNCH_FEATHERS). Set MEGABONK_RELAUNCH_SPAWNS=false or
      MEGABONK_RELAUNCH_INVULNERABLE=true in .env to stop enemy spawns or
      make the player invulnerable. The mod's level loader
      spawns Tony McZoom, and editor mode starts from the overview camera
      pose, 60 units above the player. Build and deploy the mod first
      (task mod:build); a rebuilt DLL only loads on a fresh launch.
    cmds:
      - uv run scripts/run.py relaunch {{.CLI_ARGS}}

  harness:
    desc: "Drive the dev harness in the running game (enable, disable, load, screenshot, quit, cycle)"
    summary: |
      Usage: task game:harness -- cycle levels/example-forest.mblevel.json out.png

      Wraps scripts/run.py; see docs/development.md.
    cmds:
      - uv run scripts/run.py {{.CLI_ARGS}}

# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

vars:
  UNITY_BIN: '{{.UNITY_EDITOR | default "/Applications/Unity/Hub/Editor/2023.2.22f1/Unity.app/Contents/MacOS/Unity"}}'
  REMOTE_UNITY: '{{.KF1_UNITY_BIN | default "/Applications/Unity/Hub/Editor/2023.2.22f1/Unity.app/Contents/MacOS/Unity"}}'
  REMOTE_REPO: ~/git/megabonk_mods

tasks:
  pack:
    desc: "Build the kf1preview Mountain Pass bundles for Windows and Linux with Unity"
    summary: |
      Usage: task kf1:pack

      Needs Unity 2023.2.22f1 on this box (UNITY_EDITOR in .env overrides the Hub path) and the KF1
      converter outputs under .tools/kf1: mesh.json plus out/**/*.tga. verify-pack names the material
      whose texture is missing instead of building a pack with holes in it. The build is incremental:
      a repeat run reports "up to date" until a builder, manifest or asset changes, and
      task kf1:pack --force rebuilds. On a box without Unity, build where it lives with
      task kf1:pack-host KF1_UNITY_HOST=<host>. See docs/kf1-mountain-pass.md.
    sources: &kf1-pack-sources
      - unity/pack-authoring/Assets/Editor/Kf1MountainPassPack.cs
      - unity/pack-authoring/Assets/Editor/PackBuilder.cs
      - unity/pack-authoring/Assets/ColorsVertexTint.shader
      - unity/pack-authoring/packs/kf1preview/manifest.json
      - scripts/kf1_mountain_pass.py
      - .tools/kf1/mesh.json
      - .tools/kf1/out/**/*.tga
    generates: &kf1-pack-generates
      - .tools/bundles/windows/kf1preview
      - .tools/bundles/linux/kf1preview
    cmds:
      - uv run scripts/kf1_mountain_pass.py verify-pack
      - |
        bin="{{.UNITY_BIN}}"
        [ -x "$bin" ] || { echo "task kf1:pack: Unity 2023.2.22f1 is not at $bin; set UNITY_EDITOR in .env or build on the Unity box with task kf1:pack-host KF1_UNITY_HOST=<host>" >&2; exit 1; }
      - task: :pack:build
        vars: {PACK_METHOD: Kf1MountainPassPack.Build}

  pack-host:
    desc: "Build kf1preview on the box that has Unity and bring both bundles back (KF1_UNITY_HOST)"
    summary: |
      Usage: task kf1:pack-host KF1_UNITY_HOST=<host>

      Pushes the pack-authoring project, without its Unity import caches, and the KF1 inputs to
      <host>:~/git/megabonk_mods, runs the same Kf1MountainPassPack.Build there with
      KF1_UNITY_BIN (default the Hub 2023.2.22f1 path), and pulls
      .tools/bundles/{windows,linux}/kf1preview back. Same sources and generates as kf1:pack, so a
      repeat run is a no-op until an input changes. Needs passwordless SSH and a checkout at
      ~/git/megabonk_mods on the host.
    vars:
      HOST: '{{.KF1_UNITY_HOST}}'
    sources: *kf1-pack-sources
    generates: *kf1-pack-generates
    cmds:
      - uv run scripts/kf1_mountain_pass.py verify-pack
      - |
        host="{{.HOST}}"
        [ -n "$host" ] || { echo "task kf1:pack-host: KF1_UNITY_HOST is empty; set it in .env to the box with Unity 2023.2.22f1" >&2; exit 1; }
        repo="{{.REMOTE_REPO}}"
        /usr/bin/ssh "$host" "mkdir -p $repo/.tools/bundles/windows $repo/.tools/bundles/linux"
        rsync -aq -e /usr/bin/ssh --exclude Library/ --exclude Temp/ --exclude Logs/ --exclude UserSettings/ \
          --exclude Assets/Kf1MountainPass/ --exclude Assets/ConkerColors/ --exclude Assets/Thps/ \
          unity/pack-authoring/ "$host:$repo/unity/pack-authoring/"
        rsync -aq -e /usr/bin/ssh .tools/kf1/mesh.json .tools/kf1/out "$host:$repo/.tools/kf1/"
        /usr/bin/ssh "$host" "\"{{.REMOTE_UNITY}}\" -batchmode -nographics -quit \
          -projectPath $repo/unity/pack-authoring -executeMethod Kf1MountainPassPack.Build \
          -packOutput $repo/.tools/bundles -logFile -"
        rsync -aq -e /usr/bin/ssh "$host:$repo/.tools/bundles/windows/kf1preview" .tools/bundles/windows/
        rsync -aq -e /usr/bin/ssh "$host:$repo/.tools/bundles/linux/kf1preview" .tools/bundles/linux/
        echo "built kf1preview on $host into .tools/bundles/{windows,linux}"

  install:
    desc: "Install the built kf1preview pack and its manifest into the game's UserData/LevelPacks"
    summary: |
      Usage: task kf1:install

      Copies the bundle for the game's runtime (windows under CrossOver and Wine, linux natively)
      and unity/pack-authoring/packs/kf1preview/manifest.json into
      <game dir>/UserData/LevelPacks/kf1preview. A running game only sees the pack after a relaunch.
    cmds:
      - task: :pack:install
        vars: {PACK: kf1preview}

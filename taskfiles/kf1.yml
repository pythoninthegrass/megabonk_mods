# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

vars:
  UNITY_BIN: '{{.UNITY_EDITOR | default "/Applications/Unity/Hub/Editor/2023.2.22f1/Unity.app/Contents/MacOS/Unity"}}'

tasks:
  pack:
    desc: "Build the kf1 Mountain Pass bundles for Windows and Linux with Unity"
    summary: |
      Usage: task kf1:pack

      Run it on a box that has Unity 2023.2.22f1; UNITY_EDITOR in .env overrides the default Hub path
      and the task names the editor it looked for when there is none. It builds the bundle from the
      converter outputs under .tools/kf1, mesh.json plus out/**/*.tga, so those have to be present and
      current on the building box. verify-pack runs first and names the material whose texture is
      missing instead of building a pack with holes in it. The build is incremental: a repeat run
      reports "up to date" until a builder, manifest or asset changes, and task kf1:pack --force
      rebuilds. A box without Unity gets the bundle from a build box and installs it with
      task kf1:install. See docs/kf1-mountain-pass.md.
    sources:
      - unity/pack-authoring/Assets/Editor/Kf1MountainPassPack.cs
      - unity/pack-authoring/Assets/Editor/PackBuilder.cs
      - unity/pack-authoring/Assets/ColorsVertexTint.shader
      - unity/pack-authoring/packs/kf1/manifest.json
      - scripts/kf1_mountain_pass.py
      - .tools/kf1/mesh.json
      - .tools/kf1/out/**/*.tga
    generates:
      - .tools/bundles/windows/kf1
      - .tools/bundles/linux/kf1
    cmds:
      - uv run scripts/kf1_mountain_pass.py verify-pack
      - |
        bin="{{.UNITY_BIN}}"
        [ -x "$bin" ] || { echo "task kf1:pack: Unity 2023.2.22f1 is not at $bin; install it (unity install 2023.2.22f1 or the Hub), point UNITY_EDITOR in .env at the editor, or build on the box that has it and bring .tools/bundles/<platform>/kf1 back" >&2; exit 1; }
      - task: :pack:build
        vars: {PACK_METHOD: Kf1MountainPassPack.Build}

  install:
    desc: "Install the built kf1 pack and its manifest into the game's UserData/LevelPacks"
    summary: |
      Usage: task kf1:install

      Copies the bundle for the game's runtime (windows under CrossOver and Wine, linux natively)
      from .tools/bundles/<platform>/kf1, with
      unity/pack-authoring/packs/kf1/manifest.json, into
      <game dir>/UserData/LevelPacks/kf1. A running game only sees the pack after a relaunch.
    cmds:
      - task: :pack:install
        vars: {PACK: kf1}

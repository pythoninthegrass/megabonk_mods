# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

tasks:
  dump:
    desc: "Regenerate Il2CppDumper output into .tools/il2cpp_dump/ (gitignored) from the live game install"
    summary: |
      Usage: task re:dump

      Runs Il2CppDumper's net7 build under the mise-managed dotnet 10 SDK
      with DOTNET_ROLL_FORWARD=LatestMajor (there is no standalone net7
      runtime on this machine). See tools/il2cpp_dump.py.
    deps: [_install-dotnet]
    cmds:
      - uv run tools/il2cpp_dump.py

  _install-dotnet:
    internal: true
    desc: "Install the mise-managed dotnet SDK used to run Il2CppDumper"
    cmds:
      - mise install dotnet@10.0.108
    status:
      - mise where dotnet@10.0.108 >/dev/null 2>&1

# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

tasks:
  dump:
    desc: "Regenerate Il2CppDumper output into .tools/il2cpp_dump/ (gitignored) from the live game install"
    summary: |
      Usage: task re:dump

      Runs Il2CppDumper's net7 build under the mise-managed dotnet 10 SDK
      with DOTNET_ROLL_FORWARD=LatestMajor (there is no standalone net7
      runtime on this machine). See scripts/il2cpp_dump.py.
    deps: [_install-dotnet]
    cmds:
      - uv run scripts/il2cpp_dump.py

  linux-metadata:
    desc: "Rsync the native Linux build's global-metadata.dat into the mirrored game dir"
    summary: |
      Usage: task re:linux-metadata

      Fetches Megabonk_Data/il2cpp_data/Metadata/global-metadata.dat from the same
      player box and directory as re:shaders-pull (MEGABONK_LINUX_BUILD_RSYNC in the
      gitignored .env) into .tools/megabonk-linux-native/Megabonk/, the layout
      re:dump-linux expects. Il2CppDumper pairs a metadata file with one build:
      a name it prints is only as good as that pairing, so the recipe prints both
      hashes and the GameAssembly.so hash must match the pinned image before any
      name is trusted. See "Cross-checking the lift against an external
      reconstruction" in docs/development.md.
    preconditions:
      - sh: '[ -n "${MEGABONK_LINUX_BUILD_RSYNC:-}" ]'
        msg: "Set MEGABONK_LINUX_BUILD_RSYNC in .env to <host>:<path>/Megabonk/"
    cmds:
      - mkdir -p .tools/megabonk-linux-native/Megabonk/Megabonk_Data/il2cpp_data/Metadata
      - rsync -a "$MEGABONK_LINUX_BUILD_RSYNC"Megabonk_Data/il2cpp_data/Metadata/global-metadata.dat
        .tools/megabonk-linux-native/Megabonk/Megabonk_Data/il2cpp_data/Metadata/
      - shasum -a 256 .tools/megabonk-linux-native/Megabonk/GameAssembly.so
        .tools/megabonk-linux-native/Megabonk/Megabonk_Data/il2cpp_data/Metadata/global-metadata.dat

  dump-linux:
    desc: "Regenerate Il2CppDumper output into .tools/il2cpp_dump_linux/ from the mirrored Linux build"
    summary: |
      Usage: task re:dump-linux [LINUX_GAME=<dir>] [LINUX_OUT=<dir>]

      The same Il2CppDumper run as re:dump, over the pinned native Linux
      GameAssembly.so plus the metadata that shipped beside it. This is the dump
      whose RVAs address the scored image; the Windows dump.cs from re:dump does
      not. Needs task re:linux-metadata first.
    deps: [_install-dotnet]
    vars:
      LINUX_GAME: '{{.LINUX_GAME | default ".tools/megabonk-linux-native/Megabonk"}}'
      LINUX_OUT: '{{.LINUX_OUT | default ".tools/il2cpp_dump_linux"}}'
    preconditions:
      - sh: '[ -f "{{.LINUX_GAME}}/GameAssembly.so" ] || [ -f "{{.LINUX_GAME}}/GameAssembly.dll" ]'
        msg: "No GameAssembly under {{.LINUX_GAME}}; see docs/development.md for the rsync step"
      - sh: '[ -f "{{.LINUX_GAME}}/Megabonk_Data/il2cpp_data/Metadata/global-metadata.dat" ]'
        msg: "No global-metadata.dat beside the mirrored build; run task re:linux-metadata"
    cmds:
      - uv run scripts/il2cpp_dump.py --game "{{.LINUX_GAME}}" --out "{{.LINUX_OUT}}"

  shaders-metal:
    desc: "Translate every shipped GLSL program to MSL and score the Metal compile pass rate"
    vars:
      SHADERS_BUILD: '{{.SHADERS_BUILD | default ".tools/megabonk-linux-native/Megabonk"}}'
      SHADERS_PLATFORM: '{{.SHADERS_PLATFORM | default "15"}}'
      SHADERS_STAGES: '{{.SHADERS_STAGES | default "glslang,spirv,metal"}}'
      SHADERS_JOBS: '{{.SHADERS_JOBS | default "12"}}'
      SHADERS_OUT: '{{.SHADERS_OUT | default ".tools/shaders-metal"}}'
      SHADERS_EXTRA: '{{.SHADERS_EXTRA | default ""}}'
    summary: |
      Usage: task re:shaders-metal [SHADERS_BUILD=<linux build dir>]
             [SHADERS_PLATFORM=15] [SHADERS_STAGES=glslang,spirv,metal]
             [SHADERS_JOBS=12] [SHADERS_OUT=<dir>]
             [SHADERS_EXTRA=--fresh|--no-normalize|--glslang-target-env=vulkan1.0]

      Extracts one '#ifdef <STAGE>'-guarded GLSL program per chunk from the
      platform-<SHADERS_PLATFORM> serialized shader blobs of a native Linux
      build, then drives glslangValidator -> SPIR-V -> spirv-cross --msl ->
      'xcrun -sdk macosx metal -c'. Prints a machine-readable JSON summary on
      stdout and writes per-program artifacts, cache.jsonl and summary.json to
      SHADERS_OUT (default .tools/shaders-metal). Needs glslang and spirv-cross
      (brew install glslang spirv-cross) and the Xcode command line tools.
      SHADERS_BUILD defaults to .tools/megabonk-linux-native/Megabonk. See
      scripts/shader_metal_pass.py.
    cmds:
      - uv run --script scripts/shader_metal_pass.py "{{.SHADERS_BUILD}}"
        --platform "{{.SHADERS_PLATFORM}}" --stages "{{.SHADERS_STAGES}}"
        --jobs "{{.SHADERS_JOBS}}" --out "{{.SHADERS_OUT}}" {{.SHADERS_EXTRA}}

  shaders-pull:
    desc: "Rsync the native Linux Megabonk build from the player box into .tools/"
    summary: |
      Usage: task re:shaders-pull

      Copies the Linux build into gitignored .tools/megabonk-linux-native/Megabonk/
      for re:shaders-metal. The rsync source lives in the gitignored .env as
      MEGABONK_LINUX_BUILD_RSYNC ("<host>:<path to the Megabonk app dir>/"),
      keeping the player box's hostname out of tracked files.

    preconditions:
      - sh: '[ -n "${MEGABONK_LINUX_BUILD_RSYNC:-}" ]'
        msg: "Set MEGABONK_LINUX_BUILD_RSYNC in .env to <host>:<path>/Megabonk/"
    cmds:
      - mkdir -p .tools/megabonk-linux-native
      - rsync -a --delete "$MEGABONK_LINUX_BUILD_RSYNC" .tools/megabonk-linux-native/Megabonk/

  native-bind:
    desc: "Score the loader-free native binding spike: dlopen GameAssembly by exported symbol (macOS legs, Linux control leg)"
    vars:
      NATIVE_BIND_APP: '{{.NATIVE_BIND_APP | default ".tools/native-bind/ProbePlayer.app"}}'
      NATIVE_BIND_OUT: '{{.NATIVE_BIND_OUT | default ".tools/native-bind"}}'
      NATIVE_BIND_ARCH: '{{.NATIVE_BIND_ARCH | default "both"}}'
      NATIVE_BIND_LEGS: '{{.NATIVE_BIND_LEGS | default "leg1,leg2,leg3"}}'
      NATIVE_BIND_LINUX_BUILD: '{{.NATIVE_BIND_LINUX_BUILD | default ".tools/megabonk-linux-native/Megabonk"}}'
      NATIVE_BIND_EXTRA: '{{.NATIVE_BIND_EXTRA | default ""}}'
    summary: |
      Usage: task re:native-bind [NATIVE_BIND_APP=<.app>] [NATIVE_BIND_OUT=<dir>]
             [NATIVE_BIND_ARCH=both|x86_64|arm64] [NATIVE_BIND_LEGS=leg1,leg2,leg3]
             [NATIVE_BIND_EXTRA=--quiet|--only Rewired|--skip-preflight ...]

       Compiles scripts/native_bind_probe/host.c into a loader-free native host and
       scores three legs against a GameAssembly binary: exported-symbol binding, a
       managed static method invoked by name, and a self-authored trampoline on an
       exported il2cpp function. Writes summary.json (with a per-attempt ladder) to
       NATIVE_BIND_OUT. Leg 2 runs a candidate ladder; --only <text> narrows it.

       The macOS legs probe NATIVE_BIND_APP, a locally built Unity 2023.2.22f1 IL2CPP
       universal player (there is no shipped macOS Megabonk build). The Linux control
       leg runs the same driver over ssh on the player box against the shipped
       GameAssembly.so and shipped metadata; it needs MEGABONK_LINUX_BUILD_RSYNC in
       .env ("<host>:<path>/Megabonk/"), which keeps that box's hostname out of
       tracked files. See the "Binding the Il2Cpp runtime without a mod loader"
       section in docs/development.md.
    preconditions:
      - sh: '[ -d "{{.NATIVE_BIND_APP}}" ]'
        msg: "No probe player bundle at {{.NATIVE_BIND_APP}}; see docs/development.md to build it, or pass NATIVE_BIND_APP"
    cmds:
      - uv run --script scripts/native_bind_probe.py --app "{{.NATIVE_BIND_APP}}"
        --arch "{{.NATIVE_BIND_ARCH}}" --legs "{{.NATIVE_BIND_LEGS}}"
        --out "{{.NATIVE_BIND_OUT}}" {{.NATIVE_BIND_EXTRA}}
      - |
        if [ -n "${MEGABONK_LINUX_BUILD_RSYNC:-}" ]; then
          host="${MEGABONK_LINUX_BUILD_RSYNC%%:*}"
          dir="${MEGABONK_LINUX_BUILD_RSYNC#*:}"
          dir="${dir%/}"
          uv run --script scripts/native_bind_probe.py \
            --dylib "{{.NATIVE_BIND_LINUX_BUILD}}/GameAssembly.so" \
            --metadata "{{.NATIVE_BIND_LINUX_BUILD}}/Megabonk_Data/il2cpp_data/Metadata" \
            --platform linux --arch x86_64 --legs leg1,leg2 \
            --linux-target x86_64 --linux-host "$host" --linux-target-dir "$dir" \
            --remote-only --out "{{.NATIVE_BIND_OUT}}-linux" --skip-preflight
        else
          echo "skipping the Linux control leg: set MEGABONK_LINUX_BUILD_RSYNC in .env"
        fi

  elf-shim:
    desc: "Score the ELF-load-and-shim step: can the shipped Linux runtime be made loadable on macOS"
    vars:
      ELF_SHIM_SO: '{{.ELF_SHIM_SO | default ".tools/megabonk-linux-native/Megabonk/GameAssembly.so"}}'
      ELF_SHIM_OUT: '{{.ELF_SHIM_OUT | default ".tools/elf-shim"}}'
      ELF_SHIM_ARCHS: '{{.ELF_SHIM_ARCHS | default "x86_64 arm64"}}'
      ELF_SHIM_EXTRA: '{{.ELF_SHIM_EXTRA | default ""}}'
    summary: |
      Usage: task re:elf-shim [ELF_SHIM_SO=<GameAssembly.so>] [ELF_SHIM_OUT=<dir>]
             [ELF_SHIM_ARCHS="x86_64 arm64"] [ELF_SHIM_EXTRA=--skip-dyld-probe]

       The last unmeasured input behind choosing Route B over Route C. Reads the shipped
       Linux GameAssembly.so with a stdlib ELF reader, asks the live macOS loader (via
       scripts/native_bind_probe/symprobe.c) which imports it can actually resolve, and
       scores four legs: import shim feasibility, glibc version-node binding,
       relocation translatability, and the load strategy. Nothing launches the runtime.

       Each target architecture in ELF_SHIM_ARCHS is scored separately because Apple
       silicon's 16 KB pages change whether the PT_LOAD segments can be mapped straight
       from the file. Writes summary.json per target under ELF_SHIM_OUT-<arch>.
       --skip-dyld-probe analyses ELF structure only and never reports feasible.

       See the "Loading and shimming the Linux ELF runtime" section in
       docs/development.md.
    preconditions:
      - sh: '[ -f "{{.ELF_SHIM_SO}}" ]'
        msg: "No Linux GameAssembly.so at {{.ELF_SHIM_SO}}; see docs/development.md for the rsync step that populates .tools/megabonk-linux-native"
    cmds:
      - |
        rc=0
        for arch in {{.ELF_SHIM_ARCHS}}; do
          echo "== target $arch =="
          uv run --script scripts/elf_shim_probe.py \
            --so "{{.ELF_SHIM_SO}}" \
            --out "{{.ELF_SHIM_OUT}}-$arch" \
            --target-arch "$arch" {{.ELF_SHIM_EXTRA}} || rc=1
        done
        exit $rc

  lift-probe:
    desc: "Score whether shipped x86-64 il2cpp bodies lift to LLVM IR that compiles for arm64"
    vars:
      LIFT_SO: '{{.LIFT_SO | default ".tools/megabonk-linux-native/Megabonk/GameAssembly.so"}}'
      LIFT_OUT: '{{.LIFT_OUT | default ".tools/lift-probe"}}'
      LIFT_PER_CLASS: '{{.LIFT_PER_CLASS | default "300"}}'
      LIFT_SEED: '{{.LIFT_SEED | default "80"}}'
      LIFT_EXTRA: '{{.LIFT_EXTRA | default ""}}'
      LIFT_PIPELINE: '{{.LIFT_PIPELINE | default ""}}'
    summary: |
      Usage: task re:lift-probe [LIFT_SO=<GameAssembly.so>] [LIFT_OUT=<dir>]
             [LIFT_PER_CLASS=300] [LIFT_SEED=80]
             [LIFT_EXTRA=--r2-per-class 0|--tool-timeout 600|--jobs 4|--extra=--mcpu=neoverse-n1]
             [LIFT_PIPELINE='default<O2>']

      Draws LIFT_PER_CLASS bodies from each size class (tiny <= 63 B, small <= 512 B,
      large above) of the il2cpp section, bounded by the .eh_frame records, dumps their
      raw pcode and Ghidra-recovered jump tables through headless Ghidra, lifts each to
      LLVM IR (scripts/pcode_lift.py), and scores four stages per body: fully decoded,
      lifted with no holes, accepted by the LLVM verifier, compiled to an arm64 object.
      A radare2 leg scores its function extents and whether its pdc output compiles.
      Writes summary.json and bodies.jsonl to LIFT_OUT. Needs the brew llvm (keg-only,
      named by path), Ghidra and radare2 (brew install llvm ghidra radare2).

      Every sampled body is accounted for: one the dump never emitted, or one whose lift
      or LLVM tool timed out or crashed, is recorded in summary.json under failures and
      failed_bodies with its address rather than dropped from the totals, and the run
      exits non-zero if a body never reached the scorer. A body opt or llc merely rejects
      is a measurement, not a failure. --tool-timeout bounds one opt or llc run and
      --ghidra-timeout the whole dump; a Ghidra run that dies partway keeps the rows it
      wrote and leaves its console output in LIFT_OUT/ghidra-stdout.txt.

      The sampling seed and size classes are fixed so a run is reproducible. See the
      "Lifting the shipped code to arm64" section in docs/development.md.
    preconditions:
      - sh: '[ -f "{{.LIFT_SO}}" ]'
        msg: "No Linux GameAssembly.so at {{.LIFT_SO}}; see docs/development.md for the rsync step that populates .tools/megabonk-linux-native"
    cmds:
      - uv run --script scripts/lift_probe.py "{{.LIFT_SO}}" --out "{{.LIFT_OUT}}"
        --per-class "{{.LIFT_PER_CLASS}}" --seed "{{.LIFT_SEED}}" {{.LIFT_EXTRA}}
        {{if .LIFT_PIPELINE}}--pipeline "{{.LIFT_PIPELINE}}"{{end}}

  native-exec:
    desc: "Run a lifted shipped game method natively on arm64 and compare it with the shipped Linux runtime"
    vars:
      NATIVE_EXEC_SO: '{{.NATIVE_EXEC_SO | default ".tools/megabonk-linux-native/Megabonk/GameAssembly.so"}}'
      NATIVE_EXEC_OUT: '{{.NATIVE_EXEC_OUT | default ".tools/native-exec"}}'
      NATIVE_EXEC_EXTRA: '{{.NATIVE_EXEC_EXTRA | default ""}}'
    summary: |
      Usage: task re:native-exec [NATIVE_EXEC_SO=<GameAssembly.so>] [NATIVE_EXEC_OUT=<dir>]
             [NATIVE_EXEC_EXTRA=--capture-linux-host <ssh host>|--candidate-override 7|--depth 1]

      Lifts InventoryUtility.GetWeaponMaxLevel from the shipped Linux GameAssembly.so,
      compiles it for arm64, runs it natively and compares its result with the value the
      shipped Linux runtime returned for the same method. Reads the Linux control from
      NATIVE_EXEC_OUT/linux-control.raw; --capture-linux-host records a fresh one over
      ssh (the box's hostname stays out of tracked files). Writes report.json and the
      build under NATIVE_EXEC_OUT/run. Exits non-zero when any check fails, including
      with --candidate-override. See "Executing a lifted shipped method" in
      docs/development.md.
    preconditions:
      - sh: '[ -f "{{.NATIVE_EXEC_SO}}" ]'
        msg: "No Linux GameAssembly.so at {{.NATIVE_EXEC_SO}}; see docs/development.md for the rsync step that populates .tools/megabonk-linux-native"
    cmds:
      - uv run --script scripts/native_exec_probe.py --so "{{.NATIVE_EXEC_SO}}" --out "{{.NATIVE_EXEC_OUT}}" {{.NATIVE_EXEC_EXTRA}}

  native-calls:
    desc: "Verify typed arm64 calls against shipped Linux Mathf.Clamp overloads"
    vars:
      NATIVE_CALL_SO: '{{.NATIVE_CALL_SO | default ".tools/megabonk-linux-native/Megabonk/GameAssembly.so"}}'
      NATIVE_CALL_OUT: '{{.NATIVE_CALL_OUT | default ".tools/native-calls"}}'
      NATIVE_CALL_EXTRA: '{{.NATIVE_CALL_EXTRA | default ""}}'
    cmds:
      - uv run --script scripts/native_call_probe.py --so "{{.NATIVE_CALL_SO}}" --out "{{.NATIVE_CALL_OUT}}" {{.NATIVE_CALL_EXTRA}}

  lift-image:
    desc: "Account for every byte of the shipped image's executable sections before a full lift"
    vars:
      LIFT_SO: '{{.LIFT_SO | default ".tools/megabonk-linux-native/Megabonk/GameAssembly.so"}}'
      LIFT_OUT: '{{.LIFT_OUT | default ".tools/lift-image"}}'
    summary: |
      Usage: task re:lift-image [LIFT_SO=<GameAssembly.so>] [LIFT_OUT=<dir>]

      Splits each executable section into .eh_frame bodies, decoded nop padding, frame-less
      stub bytes and unaccounted code, and writes coverage.json to LIFT_OUT. Exits 1 while any
      code is unaccounted. Needs the brew llvm.
    preconditions:
      - sh: '[ -f "{{.LIFT_SO}}" ]'
        msg: "No Linux GameAssembly.so at {{.LIFT_SO}}; see docs/development.md for the rsync step that populates .tools/megabonk-linux-native"
    cmds:
      - uv run --script scripts/lift_image.py "{{.LIFT_SO}}" --out "{{.LIFT_OUT}}"

  lift-image-build:
    desc: "Resume the complete-image arm64 lift and report blocking bodies"
    vars:
      LIFT_SO: '{{.LIFT_SO | default ".tools/megabonk-linux-native/Megabonk/GameAssembly.so"}}'
      LIFT_OUT: '{{.LIFT_OUT | default ".tools/lift-image-full"}}'
    cmds:
      - uv run scripts/lift_image.py "{{.LIFT_SO}}" --build --out "{{.LIFT_OUT}}" --ghidra-jobs 1 --ghidra-timeout 600 {{.CLI_ARGS}}

  lift-link:
    desc: "Link a scored image's lifted bodies into one arm64 dylib, with holes as logged traps"
    vars:
      LIFT_SO: '{{.LIFT_SO | default ".tools/megabonk-linux-native/Megabonk/GameAssembly.so"}}'
      LIFT_BASELINE: '{{.LIFT_BASELINE | default ".tools/lift-image-full"}}'
      LIFT_OUT: '{{.LIFT_OUT | default ".tools/lift-link"}}'
    summary: |
      Usage: task re:lift-link [LIFT_SO=<GameAssembly.so>] [LIFT_BASELINE=<dir>] [LIFT_OUT=<dir>]

      Reads the pcode shards of a finished task re:lift-image-build run (LIFT_BASELINE), lifts
      every body with each unresolved jump turned into a logged lift_hole trap, compiles one
      object per shard plus one for the relocated data sections, and links libgameassembly.dylib
      into LIFT_OUT. Resumes from objects whose identity still matches. This is a development
      build: it never changes or claims the baseline's runnable verdict. See scripts/lift_link.py.
    preconditions:
      - sh: '[ -f "{{.LIFT_BASELINE}}/summary.json" ]'
        msg: "No finished build at {{.LIFT_BASELINE}}; run task re:lift-image-build first"
    cmds:
      - uv run scripts/lift_link.py "{{.LIFT_SO}}" --baseline "{{.LIFT_BASELINE}}" --out "{{.LIFT_OUT}}" {{.CLI_ARGS}}

  lift-names:
    desc: "Name scored lift bodies by joining the Linux dump.cs RVAs to their body starts"
    summary: |
      Usage: task re:lift-names [NAMES_DUMP=<dump.cs>] [NAMES_BODIES=<bodies.jsonl>]
             [NAMES_OUT=<names.jsonl>]

      The ELF's .symtab names nothing inside the il2cpp section, so a body is only
      legible through metadata: dump.cs lists every managed method with its RVA, and
      an RVA equal to a body start names that body. Prints the named/clean/blocked
      counts and one line per blocked body, and writes the blocked rows as JSONL to
      NAMES_OUT. NAMES_DUMP must be the Linux dump from task re:dump-linux: names
      come from global-metadata.dat, so a dump of another build labels bodies wrongly.
      See scripts/lift_names.py.
    vars:
      NAMES_DUMP: '{{.NAMES_DUMP | default ".tools/il2cpp_dump_linux/dump.cs"}}'
      NAMES_BODIES: '{{.NAMES_BODIES | default ".tools/lift-image-full-v5/bodies.jsonl"}}'
      NAMES_OUT: '{{.NAMES_OUT | default ".tools/lift-image-full-v5/names-blocked.json"}}'
    preconditions:
      - sh: '[ -f "{{.NAMES_DUMP}}" ]'
        msg: "No dump.cs at {{.NAMES_DUMP}}; run task re:linux-metadata then task re:dump-linux"
      - sh: '[ -f "{{.NAMES_BODIES}}" ]'
        msg: "No bodies.jsonl at {{.NAMES_BODIES}}; run task re:lift-image-build first"
    cmds:
      - uv run scripts/lift_names.py --dump "{{.NAMES_DUMP}}" --bodies "{{.NAMES_BODIES}}"
        --out "{{.NAMES_OUT}}" --blocked-only

  lift-holes:
    desc: "Classify the unresolved computed jumps (BRANCHIND, JUMPTABLE_TARGET) left in a lift probe sample"
    vars:
      LIFT_SO: '{{.LIFT_SO | default ".tools/megabonk-linux-native/Megabonk/GameAssembly.so"}}'
      LIFT_OUT: '{{.LIFT_OUT | default ".tools/lift-probe"}}'
      LIFT_EXTRA: '{{.LIFT_EXTRA | default ""}}'
    summary: |
      Usage: task re:lift-holes [LIFT_SO=<GameAssembly.so>] [LIFT_OUT=<dir>]
             [LIFT_EXTRA=--json|--bodies <bodies.jsonl>]

      Reads LIFT_OUT/bodies.jsonl from a prior task re:lift-probe run (run that first),
      takes the bodies whose holes include BRANCHIND or JUMPTABLE_TARGET, redumps their
      pcode through headless Ghidra, and gives every indirect jump site a category from
      the structure that leads to it: unrecovered switch, indirect tail call, indirect
      call target, or other. Evidence per site is the x86 sequence from llvm-objdump, the
      traced pcode, the section the target was loaded from, any R_X86_64_RELATIVE on that
      slot, and the jump tables Ghidra's decompiler recovered. Writes jump_holes.jsonl to
      LIFT_OUT and prints the per-category counts. It records only: no lifting rule is
      added and scripts/pcode_lift.py is not involved. Needs the brew llvm and Ghidra.

      See the "Lifting the shipped code to arm64" section in docs/development.md.
    preconditions:
      - sh: '[ -f "{{.LIFT_SO}}" ]'
        msg: "No Linux GameAssembly.so at {{.LIFT_SO}}; see docs/development.md for the rsync step that populates .tools/megabonk-linux-native"
      - sh: '[ -f "{{.LIFT_OUT}}/bodies.jsonl" ]'
        msg: "No {{.LIFT_OUT}}/bodies.jsonl; run task re:lift-probe first"
    cmds:
      - uv run --script scripts/lift_holes.py "{{.LIFT_SO}}" --out "{{.LIFT_OUT}}" {{.LIFT_EXTRA}}

  lift-tail-calls:
    desc: "Check the emitter's indirect tail-call rule against Ghidra's decompiler for the bodies it fired on"
    vars:
      LIFT_SO: '{{.LIFT_SO | default ".tools/megabonk-linux-native/Megabonk/GameAssembly.so"}}'
      LIFT_OUT: '{{.LIFT_OUT | default ".tools/lift-probe"}}'
      LIFT_EXTRA: '{{.LIFT_EXTRA | default ""}}'
    summary: |
      Usage: task re:lift-tail-calls [LIFT_SO=<GameAssembly.so>] [LIFT_OUT=<dir>]
             [LIFT_EXTRA=--json|--bodies <bodies.jsonl>]

      Reads LIFT_OUT/bodies.jsonl from a prior task re:lift-probe run (run that first),
      keeps the bodies whose tail_calls count is non-zero, redumps their pcode through
      headless Ghidra, and compares what scripts/pcode_lift.py decided at each BRANCHIND
      site with the jump tables and the switch the decompiler recovered for the body.
      Verdicts per body: agrees, disagrees, mixed, no tail call, switch beyond body, or
      not decompiled. Writes tail_calls.jsonl and tail_calls_summary.json to LIFT_OUT and
      prints the per-verdict counts with every non-agreeing body's addresses and reasons.
      It records only: no lifting rule is added and scripts/pcode_lift.py is not modified.
      Needs the brew llvm and Ghidra.

      See the "Lifting the shipped code to arm64" section in docs/development.md.
    preconditions:
      - sh: '[ -f "{{.LIFT_SO}}" ]'
        msg: "No Linux GameAssembly.so at {{.LIFT_SO}}; see docs/development.md for the rsync step that populates .tools/megabonk-linux-native"
      - sh: '[ -f "{{.LIFT_OUT}}/bodies.jsonl" ]'
        msg: "No {{.LIFT_OUT}}/bodies.jsonl; run task re:lift-probe first"
    cmds:
      - uv run --script scripts/lift_tail_calls.py "{{.LIFT_SO}}" --out "{{.LIFT_OUT}}" {{.LIFT_EXTRA}}

  eh-coverage:
    desc: "Account for every exception-bearing il2cpp body against the lifted-code unwinder"
    vars:
      EH_SO: '{{.EH_SO | default ".tools/megabonk-linux-native/Megabonk/GameAssembly.so"}}'
      EH_OUT: '{{.EH_OUT | default ".tools/eh-coverage"}}'
      EH_EXTRA: '{{.EH_EXTRA | default ""}}'
    summary: |
      Usage: task re:eh-coverage [EH_SO=<GameAssembly.so>] [EH_OUT=<dir>]
             [EH_EXTRA="--pcode-cache <file>"]

      Interprets every call-frame description and LSDA in the il2cpp section the way the guest
      unwinder does and reports each body as supported or rejected under a named reason
      (unsupported call-frame instruction, CFA register, personality, malformed LSDA, landing
      pad outside its body). Exits non-zero when any body is rejected. With a validated pcode
      cache, also counts landing pads missing from the dumped instructions of the bodies the
      cache holds. Reads bytes only. See "Exception unwinding in lifted code" in
      docs/development.md.
    preconditions:
      - sh: '[ -f "{{.EH_SO}}" ]'
        msg: "No Linux GameAssembly.so at {{.EH_SO}}; see docs/development.md for the rsync step that populates .tools/megabonk-linux-native"
    cmds:
      - uv run --script scripts/eh_coverage.py "{{.EH_SO}}" --out "{{.EH_OUT}}" {{.EH_EXTRA}}

  eh-probe:
    desc: "Count how many il2cpp function bodies carry an LSDA and how many landing pads each has"
    vars:
      EH_SO: '{{.EH_SO | default ".tools/megabonk-linux-native/Megabonk/GameAssembly.so"}}'
      EH_OUT: '{{.EH_OUT | default ".tools/eh-probe"}}'
      EH_SECTION: '{{.EH_SECTION | default "il2cpp"}}'
      EH_EXTRA: '{{.EH_EXTRA | default ""}}'
    summary: |
      Usage: task re:eh-probe [EH_SO=<GameAssembly.so>] [EH_OUT=<dir>]
             [EH_SECTION=il2cpp] [EH_EXTRA=--json]

      Walks .eh_frame with a stdlib parser to bound every body in EH_SECTION the way the
      lift probe does, takes each body's LSDA pointer from the FDE, and reads that LSDA's
      call-site table in .gcc_except_table. Reports bodies and LSDA-bearing bodies per size
      class (tiny <= 63 B, small <= 512 B, large above), the landing-pad-count spread per
      body (none, one, two-four, five-plus, counted as distinct pad offsets because each
      becomes its own block), total call sites and pads, and the CIEs with their encodings
      and FDE counts. Writes summary.json to EH_OUT. It reads bytes only: nothing is
      loaded or run, so the personality pointer is reported as the slot it names.

      Reads the same .eh_frame bounds and size classes as scripts/lift_probe.py, so the
      body counts are comparable with task re:lift-probe. See the "Lifting the shipped
      code to arm64" section in docs/development.md.
    preconditions:
      - sh: '[ -f "{{.EH_SO}}" ]'
        msg: "No Linux GameAssembly.so at {{.EH_SO}}; see docs/development.md for the rsync step that populates .tools/megabonk-linux-native"
    cmds:
      - uv run --script scripts/eh_probe.py "{{.EH_SO}}" --section "{{.EH_SECTION}}"
        --out "{{.EH_OUT}}" {{.EH_EXTRA}}

  reloc-probe:
    desc: "Classify every R_X86_64_RELATIVE in the shipped Linux runtime by what it points at"
    vars:
      RELOC_SO: '{{.RELOC_SO | default ".tools/megabonk-linux-native/Megabonk/GameAssembly.so"}}'
      RELOC_OUT: '{{.RELOC_OUT | default ".tools/reloc-probe"}}'
      RELOC_EXTRA: '{{.RELOC_EXTRA | default ""}}'
    summary: |
      Usage: task re:reloc-probe [RELOC_SO=<GameAssembly.so>] [RELOC_OUT=<dir>]
             [RELOC_EXTRA=--json]

      Takes every R_X86_64_RELATIVE the ELF carries and classifies the address its addend
      names (a DSO links at base zero, so the addend is the pre-relocation target) into the
      seven buckets the data model needs: function_entry, function_interior, read_only_data,
      writable_data, bss, other_loaded and outside. Function bounds are the .eh_frame records
      the lift probe cuts bodies from, so an entry is a real body start rather than a guess
      from a byte pattern. Reports the same relocations again by the section holding the slot
      and by the section holding the target, the .eh_frame records and the bodies they fold
      to, how many bodies overlap, distinct target addresses, and the first bytes found at
      entry targets as a check on the entry bucket. The total is asserted against the figure
      documented in docs/development.md. Writes summary.json to RELOC_OUT. It reads bytes
      only: nothing is loaded or run.

      Shares its ELF reader with scripts/elf_shim_probe.py and its .eh_frame walk with
      scripts/eh_probe.py, so the body counts are comparable with task re:eh-probe. See the
      "Lifting the shipped code to arm64" section in docs/development.md.
    preconditions:
      - sh: '[ -f "{{.RELOC_SO}}" ]'
        msg: "No Linux GameAssembly.so at {{.RELOC_SO}}; see docs/development.md for the rsync step that populates .tools/megabonk-linux-native"
    cmds:
      - uv run --script scripts/reloc_probe.py "{{.RELOC_SO}}" --out "{{.RELOC_OUT}}" {{.RELOC_EXTRA}}

  _install-dotnet:
    internal: true
    desc: "Install the mise-managed dotnet SDK used to run Il2CppDumper"
    cmds:
      - mise install dotnet@10.0.108
    status:
      - mise where dotnet@10.0.108 >/dev/null 2>&1

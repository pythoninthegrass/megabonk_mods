# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

vars:
  WINE_VERSION: '{{.WINE_VERSION | default "11.18"}}'
  WINE_URL: '{{.WINE_URL | default (printf "https://github.com/Gcenx/macOS_Wine_builds/releases/download/%s/wine-devel-%s-osx64.tar.xz" .WINE_VERSION .WINE_VERSION)}}'
  WINE_SHA256: '{{.WINE_SHA256 | default "aa0ea4c82e636ae7bca2076387cb0a5affa26509ad13f119ecd0d62bd7ba6f82"}}'
  DXVK_VERSION: '{{.DXVK_VERSION | default "v1.10.3-20230507-repack"}}'
  DXVK_URL: '{{.DXVK_URL | default (printf "https://github.com/Gcenx/DXVK-macOS/releases/download/%s/dxvk-macOS-async-%s.tar.gz" .DXVK_VERSION .DXVK_VERSION)}}'
  DXVK_SHA256: '{{.DXVK_SHA256 | default "acd1520ad105d8ef124a09c8e11a259a5dc8bdc565ad18e0e52693f9807b2477"}}'
  WINE_ROOT: $HOME/Applications/wine11
  WINE_APP: $HOME/Applications/wine11/Wine Devel.app
  WINE_BIN:
    sh: echo "${MEGABONK_WINE:-$HOME/Applications/wine11/Wine Devel.app/Contents/Resources/wine/bin/wine}"
  PREFIX:
    sh: uv run scripts/game_paths.py | jq -r '.wine_prefix // "(none, set MEGABONK_WINE_PREFIX)"'

tasks:
  bepinex:repair:
    desc: "Restore BepInEx runtime files omitted by r2modmac Apply and park MelonLoader"
    summary: |
      Usage: task wine:bepinex:repair -- [--dry-run] [--download] [--pack-zip path]

      Quit Megabonk and Apply the BepInEx profile in r2modmac first.
      Uses the configured game folder; --game-dir overrides it. Downloads are
      opt-in and pinned to BepInExPack IL2CPP 6.0.788 with SHA-256 validation.
      Never replaces differing files, existing backups, plugins or user data.
      Launch afterward with task game:run, which supplies winhttp=n,b.
    platforms: [darwin]
    cmds:
      - uv run scripts/repair_bepinex.py {{.CLI_ARGS}}

  install:
    desc: "Install the pinned Wine build and DXVK DLLs (macOS)"
    summary: |
      Usage: task wine:install

      Runs wine:app then wine:dxvk. Each step downloads its archive, checks the
      sha256 against the pin in this file before extracting or copying
      anything, and skips itself when the pinned version is already installed.
      wine:dxvk installs into the Wine prefix named by MEGABONK_WINE_PREFIX
      (default ~/.local/share/megabonk/wine) and skips itself, with a message
      and exit 0, when that prefix does not exist yet; run 'task wine:dxvk'
      once it does.

      Override a pin by exporting WINE_VERSION, WINE_URL, WINE_SHA256,
      DXVK_VERSION, DXVK_URL or DXVK_SHA256, or by
      setting them in .env. An unset or empty value uses the pin below.
    platforms: [darwin]
    cmds:
      - task: app
      - task: dxvk

  app:
    desc: "Install the pinned Wine build into ~/Applications/wine11"
    platforms: [darwin]
    requires:
      vars: [WINE_URL, WINE_SHA256, WINE_VERSION]
    status:
      - test -x "{{.WINE_APP}}/Contents/Resources/wine/bin/wine"
      - test "$("{{.WINE_APP}}/Contents/Resources/wine/bin/wine" --version)" = "wine-{{.WINE_VERSION}}"
    cmds:
      - cmd: |
          set -eu
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fL --progress-bar -o "$tmp/wine.tar.xz" "{{.WINE_URL}}"
          echo "{{.WINE_SHA256}}  $tmp/wine.tar.xz" | shasum -a 256 -c -
          mkdir -p "{{.WINE_ROOT}}" "$tmp/x"
          tar -xJf "$tmp/wine.tar.xz" -C "$tmp/x"
          rm -rf "{{.WINE_APP}}"
          mv "$tmp/x/Wine Devel.app" "{{.WINE_APP}}"
          xattr -drs com.apple.quarantine "{{.WINE_APP}}"
          codesign --force --deep -s - "{{.WINE_APP}}"
          "{{.WINE_APP}}/Contents/Resources/wine/bin/wine" --version

  dxvk:
    desc: "Install the pinned DXVK d3d11 and d3d10core DLLs into the Wine prefix (MEGABONK_WINE_PREFIX)"
    platforms: [darwin]
    requires:
      vars: [DXVK_URL, DXVK_SHA256, DXVK_VERSION]
    status:
      - test "$(cat "{{.PREFIX}}/drive_c/windows/dxvk.installed" 2>/dev/null)" = "{{.DXVK_SHA256}}"
    cmds:
      - cmd: |
          echo "wine:dxvk skipped: no Wine prefix at {{.PREFIX}}; create the prefix or point MEGABONK_WINE_PREFIX at it, then run 'task wine:dxvk'" >&2
        if: '! test -d "{{.PREFIX}}/drive_c/windows/system32"'
      - cmd: |
          set -eu
          sys32="{{.PREFIX}}/drive_c/windows/system32"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fL --progress-bar -o "$tmp/dxvk.tar.gz" "{{.DXVK_URL}}"
          echo "{{.DXVK_SHA256}}  $tmp/dxvk.tar.gz" | shasum -a 256 -c -
          mkdir "$tmp/x"
          tar -xzf "$tmp/dxvk.tar.gz" -C "$tmp/x"
          src="$(find "$tmp/x" -type d -name x64 | head -n 1)"
          test -f "$src/d3d11.dll" -a -f "$src/d3d10core.dll"
          backup="{{.PREFIX}}/drive_c/windows/dxvk-orig"
          if [ ! -d "$backup" ]; then
            mkdir "$backup"
            cp "$sys32/d3d11.dll" "$sys32/d3d10core.dll" "$backup/"
          fi
          cp "$src/d3d11.dll" "$src/d3d10core.dll" "$sys32/"
          echo "{{.DXVK_SHA256}}" > "{{.PREFIX}}/drive_c/windows/dxvk.installed"
        if: 'test -d "{{.PREFIX}}/drive_c/windows/system32"'

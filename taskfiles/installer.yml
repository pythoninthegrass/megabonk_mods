# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

vars:
  OUT: '{{.OUT | default ".tools/installer"}}'
  # Targets the installer ships for. linux/arm64 is left out on purpose: the
  # game and its Proton prefixes are x86_64, so an arm64 player would only ever
  # run the installer, never the mod.
  TARGETS: '{{.TARGETS | default "darwin/arm64 linux/amd64 windows/amd64"}}'

tasks:
  build:
    desc: "Cross-compile the static installer binaries into .tools/installer"
    summary: |
      Usage: task installer:build [OUT=.tools/installer] [TARGETS="linux/amd64 ..."]

      Builds one pure-Go binary per target with CGO disabled. Each is a single
      file a player can download and run; on Linux the only load-time dependency
      is glibc (purego's cgo-free dlopen), and GUI libraries are loaded only at
      runtime when the progress window opens. The binaries land in
      .tools/installer; task package:linux, package:windows and package:macos copy
      the matching one into each player package.

        task installer:build
        task installer:build TARGETS=linux/amd64
    cmds:
      - |-
        set -eu
        out="$(pwd)/{{.OUT}}"
        mkdir -p "$out"
        cd go
        for target in {{.TARGETS}}; do
          os="${target%/*}"
          arch="${target#*/}"
          suffix=""
          [ "$os" = windows ] && suffix=".exe"
          name="megabonk-installer-${os}-${arch}${suffix}"
          echo "building $name"
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
            -o "$out/$name" ./cmd/megabonk-installer
        done
        ls -l "$out"

  test:
    desc: "Format-check, vet, and unit-test the Go installer"
    cmds:
      - |-
        set -eu
        cd go
        command -v go >/dev/null 2>&1 || { echo "no go toolchain installed" >&2; exit 1; }
        unformatted="$(gofmt -l .)"
        [ -z "$unformatted" ] || { echo "not gofmt-ed: $unformatted" >&2; exit 1; }
        go vet ./...
        go test ./...

  verify-static:
    desc: "Check the built binaries are cgo-free with glibc-only load deps and MyGo is the only external module"
    depends: [build]
    cmds:
      - |-
        set -eu
        cd go
        # MyGo is the one external dependency the installer allows; anything
        # else appearing as a direct requirement needs justifying here first.
        direct="$(go mod edit -json | jq -r '.Require[] | select(.Indirect != true) | .Path' | sort)"
        allowed="github.com/egoist/mygo"
        [ "$direct" = "$allowed" ] || { echo "unexpected direct dependencies:" >&2; echo "$direct" >&2; exit 1; }
        cd ..
        for target in {{.TARGETS}}; do
          os="${target%/*}"
          arch="${target#*/}"
          suffix=""
          [ "$os" = windows ] && suffix=".exe"
          binary="{{.OUT}}/megabonk-installer-${os}-${arch}${suffix}"
          [ -f "$binary" ] || { echo "$binary is missing" >&2; exit 1; }
          go version -m "$binary" | grep -q 'CGO_ENABLED=0' || { echo "$binary was built with cgo" >&2; exit 1; }
          if [ "$os" = linux ]; then
            # purego's cgo-free dlopen makes the ELF need glibc (libc/libdl/
            # libpthread) at load time; anything beyond the glibc set —
            # libgtk-3 or libwebkit2gtk in DT_NEEDED — would mean the build
            # linked a GUI library or the webview path, which is not allowed.
            extra="$(ldd "$binary" | awk '{n=$1; sub(/.*\//,"",n); print n}' | grep -Ev '^$|^(linux-vdso|ld-linux|libc|libdl|libpthread|libm|librt|libresolv|libutil)[^/]*\.so' || true)"
            [ -z "$extra" ] || { echo "$binary has unexpected dynamic dependencies:" >&2; echo "$extra" >&2; exit 1; }
          fi
          echo "verified: $binary"
        done

version: "3.0"

tasks:
  smoke:
    desc: "Build and validate the native Vita smoke-test VPK"
    cmds:
      - task: build
        vars: { APP: smoke, BUILD_DIR: '${VITA_SMOKE_BUILD_DIR:-.tools/vita-smoke}' }

  combat:
    desc: "Build and validate the native Vita combat spike VPK"
    cmds:
      - task: build
        vars: { APP: combat, BUILD_DIR: '${VITA_COMBAT_BUILD_DIR:-.tools/vita-combat}' }

  combat:deploy:
    desc: "Build, stage, and reinstall the combat VPK on the explicitly selected Vita"
    cmds:
      - |
        : "${VITA_COMBAT_SSH:?Set VITA_COMBAT_SSH to the selected Vita SSH user and host}"
        case "$VITA_COMBAT_SSH" in -*|*[!a-zA-Z0-9.@_-]*) exit 2 ;; esac
      - task: combat
      - |
        build="${VITA_COMBAT_BUILD_DIR:-.tools/vita-combat}"
        remote="/ux0/downloads/megabonk-vita-combat-$(date -u +%Y%m%dT%H%M%SZ).vpk"
        artifact="$build/megabonk-vita-combat.vpk"
        case "$artifact" in *[!a-zA-Z0-9_./\ -]*) exit 2 ;; esac
        printf 'put "%s" "%s"\n' "$artifact" "$remote" |
          /usr/bin/sftp -S /usr/bin/ssh -F /dev/null -o BatchMode=yes -o ConnectTimeout=10 -b - -- "$VITA_COMBAT_SSH"
        /usr/bin/ssh -F /dev/null -o BatchMode=yes -o ConnectTimeout=10 -- "$VITA_COMBAT_SSH" "vpk install --reinstall $remote"

  build:
    internal: true
    cmds:
      - |
        export VITASDK="${VITASDK:-$HOME/.local/opt/vitasdk}"
        export PATH="$VITASDK/bin:$PATH"
        test "$(arm-vita-eabi-gcc -dumpfullversion)" = 15.2.0 || {
          echo "VitaSDK 2026.08 with GCC 15.2.0 is required" >&2
          exit 1
        }
        build="{{.BUILD_DIR}}"
        skill=.agents/skills/vita-port/scripts
        uv run --no-project python "$skill/make_placeholder_assets.py" "$build/sce_sys"
        cmake -S vita/{{.APP}} -B "$build" -DCMAKE_BUILD_TYPE=Release
        cmake --build "$build"
        uv run --no-project python "$skill/check_vpk.py" "$build/megabonk-vita-{{.APP}}.vpk"
